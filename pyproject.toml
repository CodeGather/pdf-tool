[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-tool"
version = "0.1.0"
description = "A command-line tool for common PDF operations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pypdf>=4.0.0",
    "click>=8.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
pdf-tool = "pdf_tool.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
